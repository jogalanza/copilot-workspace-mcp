name: Release executables
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    # One native runner per OS/arch: macOS binaries get ad-hoc code-signed on the Mac runners.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:standalone
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: release/packages/*
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" release/packages/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
